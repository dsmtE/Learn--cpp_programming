<svg version="1.1" width="560" height="80" viewBox="0 0 560 80"
   xmlns="http://www.w3.org/2000/svg">
   <style>
       .pos { fill: #d6eaf8; stroke: #2980b9; }
       .vel { fill: #d5f5e3; stroke: #27ae60; }
       .col { fill: #fadbd8; stroke: #e74c3c; }
       .oth { fill: #e8daef; stroke: #8e44ad; }
       .label { font-family: Helvetica, Arial; font-size: 8px; fill: #333; text-anchor: middle; }
       .header { font-family: Helvetica, Arial; font-size: 10px; fill: #666; text-anchor: middle; }
       .cacheLine  { fill: none; stroke: #e67e22; stroke-width: 1.5; stroke-dasharray: 5,3; }
       .title { font-family: Helvetica, Arial; font-size: 12px; fill: #000; text-anchor: middle; font-weight: bold; }
   </style>
   <defs>
       <g id="pos"><rect class="pos" width="28" height="22" rx="2" stroke-width="1"/></g>
       <g id="vel"><rect class="vel" width="28" height="22" rx="2" stroke-width="1"/></g>
       <g id="col"><rect class="col" width="28" height="22" rx="2" stroke-width="1"/></g>
       <g id="oth"><rect class="oth" width="28" height="22" rx="2" stroke-width="1"/></g>
   </defs>

   <text class="title" x="270" y="16">AoS — Array of Structures</text>
   <text class="header" x="200" y="32">Particule 0 (56 octets)</text>
   <text class="header" x="490" y="32">Particule 1 (56 octets ...)</text>

   <!-- Particule 0 : 3 pos + 3 vel + 3 col + 5 autres (14 cases = 56 octets) -->
   <use href="#pos" x="5"   y="40"/><use href="#pos" x="34" y="40"/><use href="#pos" x="63"  y="40"/>
   <use href="#vel" x="92"  y="40"/><use href="#vel" x="121" y="40"/><use href="#vel" x="150" y="40"/>
   <use href="#col" x="179" y="40"/><use href="#col" x="208" y="40"/><use href="#col" x="237" y="40"/>
   <use href="#oth" x="266" y="40"/><use href="#oth" x="295" y="40"/><use href="#oth" x="324" y="40"/>
   <use href="#oth" x="353" y="40"/><use href="#oth" x="382" y="40"/>

   <!-- Particule 1 : les 2 premières cases sont encore dans la cache line -->
   <use href="#pos" x="411" y="40"/><use href="#pos" x="440" y="40"/><use href="#pos" x="469" y="40"/>
   <use href="#vel" x="498" y="40"/><use href="#vel" x="527" y="40"/>

   <!-- Labels Particule 0 (centre d'une case = x + 14) -->
   <text class="label" x="19" y="54">x</text><text class="label" x="48" y="54">y</text><text class="label" x="77"  y="54">z</text>
   <text class="label" x="106" y="54">vx</text><text class="label" x="135" y="54">vy</text><text class="label" x="164" y="54">vz</text>
   <text class="label" x="193" y="54">r</text><text class="label" x="222" y="54">g</text><text class="label" x="251" y="54">b</text>
   <text class="label" x="280" y="54">mass</text><text class="label" x="309" y="54">rot</text><text class="label" x="338" y="54">hp</text>
   <text class="label" x="367" y="54">flags</text><text class="label" x="396" y="54">lif</text>

   <!-- Labels Particule 1 -->
   <text class="label" x="425" y="54">x</text><text class="label" x="454" y="54">y</text><text class="label" x="483" y="54">z</text>
   <text class="label" x="512" y="54">vx</text><text class="label" x="541" y="54">vy</text>

   <!-- Cache line : 64 octets = 16 cases de 4 octets -->
   <rect class="cacheLine" x="2" y="36" width="464" height="30" rx="3"/>
</svg>